<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1216"/>
      <stop offset="1" stop-color="#1c2230"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4cc9f0"/>
      <stop offset="1" stop-color="#80ffdb"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Quiz sheet outline -->
  <rect x="96" y="120" width="320" height="280" rx="16" fill="none" stroke="url(#accent)" stroke-width="14"/>
  <!-- Checkbox rows -->
  <g fill="url(#accent)">
    <rect x="128" y="168" width="28" height="28" rx="6"/>
    <rect x="128" y="220" width="28" height="28" rx="6"/>
    <rect x="128" y="272" width="28" height="28" rx="6"/>
    <rect x="128" y="324" width="28" height="28" rx="6"/>
  </g>
  <g stroke="url(#accent)" stroke-width="10" stroke-linecap="round">
    <line x1="180" y1="182" x2="380" y2="182"/>
    <line x1="180" y1="234" x2="380" y2="234"/>
    <line x1="180" y1="286" x2="340" y2="286"/>
    <line x1="180" y1="338" x2="360" y2="338"/>
  </g>
  <!-- Tick mark on first checkbox -->
  <path d="M 132 182 L 144 196 L 156 170" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>